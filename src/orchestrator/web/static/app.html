<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relay</title>
<meta name="description" content="A personal assistant run by a small crew of robots. Ask once; they work while you're away and let you know when it's done.">
<meta name="theme-color" content="#121a21">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="/static/vendor/marked.min.js" defer></script>
<script src="/static/vendor/purify.min.js" defer></script>
<style>
/* Relay: a night-shift office of tin-toy robots who run your errands.
   One bold element: the front desk on Today, where the Concierge takes your request.
   Everything else is quiet slate; colour means a robot or a kind of work. */
:root {
  --bg: #121a21;
  --panel: #1b2630;
  --raised: #23313c;
  --line: #33434f;
  --ink: #eee8dc;
  --muted: #a8b1b7;
  --dim: #7b8790;
  --lamp: #f2b45a;
  --lamp-ink: #2a1d08;
  --card: #e4ebee;      /* the note card results are written on */
  --card-ink: #1f2a33;
  --card-rule: #c3d3dc;
  --card-margin: #d98b84;
  --cobalt: #5d84c9;
  --mustard: #d8a23a;
  --sage: #5fa88a;
  --brick: #c8655f;
  --violet: #9a83d9;
  --good: #6cc28f;
  --bad: #e2766b;
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --radius-s: 6px;
  --radius-m: 12px;
  --radius-l: 20px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5; }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--raised); font-weight: 700; text-decoration: none; }
.btn:hover { border-color: var(--dim); }
.btn.primary { background: var(--lamp); border-color: var(--lamp); color: var(--lamp-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.quiet { background: transparent; }
.btn.danger { color: var(--bad); background: transparent; }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn svg, .icon { width: 20px; height: 20px; flex: none; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--raised); display: inline-grid; place-items: center; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }
.rail { position: sticky; top: 0; height: 100vh; height: 100dvh; padding: 20px 14px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; background: var(--bg); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; text-decoration: none; font-family: var(--display); font-weight: 800; font-size: 1.5rem; font-variation-settings: "wdth" 85; }
.brand svg { width: 34px; height: 34px; }
.nav-link { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 12px; border-radius: var(--radius-m); text-decoration: none; color: var(--muted); font-weight: 700; }
.nav-link:hover { color: var(--ink); background: var(--panel); }
.nav-link[aria-current="page"] { color: var(--ink); background: var(--raised); }
.nav-link .count { margin-left: auto; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 999px; background: var(--lamp); color: var(--lamp-ink); font-size: 0.8rem; display: grid; place-items: center; }
.rail .me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: var(--radius-m); text-decoration: none; }
.rail .me:hover { background: var(--panel); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--raised); display: grid; place-items: center; font-weight: 700; overflow: hidden; flex: none; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.me .who { min-width: 0; }
.me .who strong, .me .who span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me .who span { color: var(--dim); font-size: 0.82rem; }
main.view { padding: 28px clamp(16px, 4vw, 48px) 120px; max-width: 1180px; width: 100%; }
.tabbar { display: none; }

/* ---------- Today: the front desk ---------- */
.desk { position: relative; display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 4px 28px; align-items: end; padding: 26px 26px 0; border-radius: var(--radius-l); background:
  radial-gradient(ellipse 340px 220px at 95px 130px, rgba(242, 180, 90, 0.22), transparent 70%), var(--panel); border: 1px solid var(--line); overflow: hidden; }
.desk-top { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.desk h1 { font-size: clamp(2rem, 4.2vw, 3.1rem); font-variation-settings: "wdth" 80, "opsz" 96; font-weight: 800; letter-spacing: -0.01em; }
.desk .date { color: var(--muted); }
.concierge-art { align-self: end; width: 190px; height: 210px; display: block; }
.desk-counter { grid-column: 1 / -1; height: 18px; margin: 0 -26px; background: #5a4636; box-shadow: 0 6px 0 #3e3127; }
.ask { position: relative; align-self: center; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-l); padding: 14px; margin-bottom: 22px; display: grid; gap: 10px; }
.ask::before { content: ""; position: absolute; left: -11px; top: 38px; width: 20px; height: 20px; background: var(--bg); border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); }
.ask:focus-within { border-color: var(--lamp); }
.ask:focus-within::before { border-color: var(--lamp); }
.ask label { font-family: var(--display); font-weight: 700; font-size: 1.15rem; padding: 2px 4px 0; }
.ask textarea { width: 100%; min-height: 56px; max-height: 240px; resize: none; border: 0; background: transparent; outline: none; padding: 4px; font-size: 1.08rem; }
.ask textarea::placeholder { color: var(--dim); }
.ask-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ask-row .spacer { flex: 1; }
.attached { display: flex; gap: 6px; flex-wrap: wrap; }
.file-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 12px; border-radius: 999px; background: var(--raised); font-size: 0.88rem; }
.file-chip button { width: 26px; height: 26px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); }
.ideas { display: flex; gap: 8px; flex-wrap: wrap; margin: 18px 0 0; }
.idea { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 13px 0 9px; font-size: 0.94rem; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); }
.idea:hover { color: var(--ink); border-color: var(--dim); }
.idea .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: #121a21; }
.idea .dot svg { width: 14px; height: 14px; }

/* the Concierge's reply */
.reply { margin-top: 18px; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: start; }
.reply .face { width: 44px; height: 46px; }
.reply-body { display: grid; gap: 12px; }
.say { background: var(--raised); border-radius: 4px var(--radius-m) var(--radius-m) var(--radius-m); padding: 10px 14px; border-left: 3px solid var(--violet); max-width: 68ch; }
.thinking { display: inline-flex; gap: 5px; align-items: center; }
.thinking i { width: 7px; height: 7px; border-radius: 50%; background: var(--violet); animation: bob 1s infinite ease-in-out; }
.thinking i:nth-child(2) { animation-delay: 0.15s; } .thinking i:nth-child(3) { animation-delay: 0.3s; }
@keyframes bob { 50% { transform: translateY(-5px); opacity: 0.6; } }
.plan { border: 1px solid var(--line); border-radius: var(--radius-m); padding: 16px; display: grid; gap: 10px; max-width: 640px; background: var(--panel); }
.plan-head { display: flex; gap: 12px; align-items: center; }
.skill-mark { width: 40px; height: 40px; border-radius: var(--radius-m); display: grid; place-items: center; background: var(--c); color: #121a21; flex: none; }
.skill-mark svg { width: 22px; height: 22px; }
.plan h3 { font-size: 1.25rem; }
.plan .kind { color: var(--muted); font-size: 0.92rem; }
.when { display: inline-flex; align-items: center; gap: 8px; color: var(--lamp); font-weight: 700; }
.plan details summary { cursor: pointer; color: var(--muted); }
.plan details p { margin: 8px 0 0; color: var(--muted); white-space: pre-wrap; }
.warn { background: #3a2f1f; border-radius: var(--radius-s); padding: 10px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.plan .actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- sections on Today ---------- */
.today-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; margin-top: 34px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.section-head h2 { font-size: 1.45rem; font-variation-settings: "wdth" 85; }
.section-head a { color: var(--muted); font-size: 0.92rem; }
.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline::before { content: ""; position: absolute; left: 91px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
.timeline li { display: grid; grid-template-columns: 72px 22px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 0; }
.timeline .t { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.timeline .t small { display: block; color: var(--dim); font-weight: 400; font-size: 0.8rem; }
.timeline .pin { width: 14px; height: 14px; border-radius: 50%; background: var(--c); margin: 5px 0 0 3px; box-shadow: 0 0 0 4px var(--bg); z-index: 1; }
.timeline .what strong { display: block; }
.timeline .what span { color: var(--muted); font-size: 0.9rem; }
.setup { border: 1px solid var(--line); border-radius: var(--radius-m); padding: 16px; display: grid; gap: 4px; }
.meter { height: 8px; border-radius: 4px; background: var(--raised); overflow: hidden; margin: 6px 0 8px; }
.meter span { display: block; height: 100%; background: var(--lamp); border-radius: 4px; transition: width 400ms ease; }
.step { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 48px; }
.check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.step.done .check { background: var(--good); border-color: var(--good); color: var(--bg); }
.step.done .label { color: var(--dim); text-decoration: line-through; }

/* ---------- Inbox ---------- */
.inbox { display: grid; grid-template-columns: minmax(260px, 360px) minmax(0, 1fr); gap: 24px; align-items: start; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.item { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; padding: 12px; border-radius: var(--radius-m); text-decoration: none; align-items: start; }
.item:hover { background: var(--panel); }
.item[aria-current="true"] { background: var(--raised); }
.item .skill-mark { width: 36px; height: 36px; border-radius: 10px; }
.item .skill-mark svg { width: 18px; height: 18px; }
.item strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .snippet { color: var(--muted); font-size: 0.9rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item .meta { text-align: right; color: var(--dim); font-size: 0.8rem; white-space: nowrap; display: grid; justify-items: end; gap: 6px; }
.unread-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--lamp); }
.state { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--raised); color: var(--muted); }
.state.running, .state.queued { color: var(--lamp); }
.state.failed, .state.skipped { color: var(--bad); }
.state.running::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--lamp); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }
.detail { display: grid; gap: 16px; min-width: 0; }
.detail-head { display: flex; gap: 14px; align-items: flex-start; }
.detail-head h1 { font-size: clamp(1.6rem, 3vw, 2.2rem); font-variation-settings: "wdth" 85; }
.detail-head .sub { color: var(--muted); }
.from-team { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: start; }
.from-team .face { width: 40px; height: 42px; }
.from-team .say { border-left-color: var(--brick); }
.note-card { position: relative; background: var(--card); color: var(--card-ink); border-radius: 4px 4px var(--radius-m) var(--radius-m); padding: 28px clamp(18px, 4vw, 40px) 28px clamp(30px, 5vw, 56px);
  background-image: linear-gradient(90deg, transparent calc(clamp(22px, 3.6vw, 40px) - 1px), var(--card-margin) calc(clamp(22px, 3.6vw, 40px) - 1px), var(--card-margin) clamp(22px, 3.6vw, 40px), transparent clamp(22px, 3.6vw, 40px)),
                    repeating-linear-gradient(var(--card) 0 27px, var(--card-rule) 27px 28px);
  box-shadow: 0 2px 0 #b9c7cf, 0 14px 30px rgba(0, 0, 0, 0.35); font-size: 1rem; line-height: 28px; overflow-wrap: anywhere; }
/* every block sits on the card's 28px ruling */
.note-card h1, .note-card h2, .note-card h3 { font-family: var(--display); line-height: 28px; margin: 28px 0 0; color: #172029; }
.note-card h1 { font-size: 1.5rem; } .note-card h2 { font-size: 1.22rem; } .note-card h3 { font-size: 1.05rem; }
.note-card > :first-child { margin-top: 0; }
.note-card p, .note-card ul, .note-card ol, .note-card table { margin: 0 0 28px; }
.note-card li > p { margin: 0; }
.note-card > :last-child { margin-bottom: 0; }
.note-card a { color: #2a5aa8; }
.note-card code { background: rgba(31, 42, 51, 0.08); padding: 1px 5px; border-radius: 4px; }
.note-card pre { background: rgba(31, 42, 51, 0.08); padding: 12px; border-radius: 6px; overflow: auto; line-height: 1.5; }
.note-card table { border-collapse: collapse; display: block; overflow: auto; line-height: 1.4; }
.note-card th, .note-card td { border: 1px solid var(--card-rule); padding: 6px 10px; text-align: left; vertical-align: top; }
.note-card blockquote { margin: 0 0 14px; padding-left: 14px; border-left: 3px solid var(--card-rule); color: #44515b; }
.note-card iframe { width: 100%; height: 520px; border: 0; background: #fff; border-radius: 6px; }
.result-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); }
.tab[aria-selected="true"] { color: var(--ink); background: var(--raised); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.office-toggle { justify-self: start; }
.office-toggle[aria-expanded="true"] { border-color: var(--lamp); }
.office-frame { width: 100%; border: 0; border-radius: var(--radius-l); background: var(--bg); min-height: 420px; display: block; }
.empty { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 48px 16px; color: var(--muted); }
.empty svg { width: 160px; height: 140px; }
.empty h2 { color: var(--ink); font-size: 1.4rem; }

/* ---------- Routines ---------- */
.routines { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.routine { border: 1px solid var(--line); border-radius: var(--radius-m); padding: 16px; display: grid; gap: 10px; background: var(--panel); border-top: 4px solid var(--c); }
.routine.off { opacity: 0.62; }
.routine-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.routine h3 { font-size: 1.15rem; }
.routine .next { color: var(--muted); font-size: 0.9rem; }
.switch { position: relative; width: 52px; height: 30px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background 200ms; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); transition: transform 200ms; }
.switch input:checked + span { background: var(--good); }
.switch input:checked + span::after { transform: translateX(22px); }
.switch input:focus-visible + span { outline: 3px solid var(--lamp); outline-offset: 2px; }
.routine .actions { display: flex; gap: 6px; flex-wrap: wrap; }
.routine .btn { min-height: 38px; padding: 0 14px; font-size: 0.92rem; }

/* ---------- Files ---------- */
.drop { border: 2px dashed var(--line); border-radius: var(--radius-l); padding: 34px 20px; display: grid; justify-items: center; gap: 10px; text-align: center; color: var(--muted); }
.drop.over { border-color: var(--lamp); background: rgba(242, 180, 90, 0.06); }
.files { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 4px; }
.file-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: var(--radius-m); }
.file-row:hover { background: var(--panel); }
.file-row .kind { width: 40px; height: 48px; border-radius: 4px 12px 4px 4px; background: var(--raised); display: grid; place-items: center; font-size: 0.7rem; font-weight: 700; color: var(--muted); }
.file-row strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Settings ---------- */
.settings { display: grid; gap: 22px; max-width: 720px; }
.card { border: 1px solid var(--line); border-radius: var(--radius-m); padding: 18px; display: grid; gap: 14px; background: var(--panel); }
.card h2 { font-size: 1.25rem; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 700; }
.field input, .field select, .field textarea { min-height: 44px; padding: 8px 12px; border-radius: var(--radius-s); border: 1px solid var(--line); background: var(--bg); }
.field textarea { min-height: 90px; resize: vertical; }
.conn { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.conn .skill-mark { width: 40px; height: 40px; }

/* ---------- signed out ---------- */
.landing { max-width: 1120px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-left)) 80px; }
.landing-top { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; gap: 16px; }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 32px; align-items: center; padding: 36px 0 56px; }
.hero h1 { font-size: clamp(2.4rem, 6vw, 4.4rem); font-variation-settings: "wdth" 78, "opsz" 96; font-weight: 800; letter-spacing: -0.015em; line-height: 0.98; }
.hero p { font-size: 1.15rem; color: var(--muted); max-width: 46ch; margin: 18px 0 26px; }
.hero .cta { display: flex; gap: 10px; flex-wrap: wrap; }
.hero-art { width: 100%; height: auto; border-radius: var(--radius-l); background: var(--panel); border: 1px solid var(--line); }
.notice { background: #3a2f1f; border-radius: var(--radius-m); padding: 12px 16px; margin-bottom: 18px; }
.uses { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.use { border-radius: var(--radius-m); padding: 16px; background: var(--panel); border: 1px solid var(--line); display: grid; gap: 8px; align-content: start; }
.use h3 { font-size: 1.1rem; }
.use p { margin: 0; color: var(--muted); font-size: 0.95rem; }
.band { padding: 56px 0 0; }
.band > h2 { font-size: clamp(1.7rem, 3.4vw, 2.4rem); font-variation-settings: "wdth" 82; margin-bottom: 20px; max-width: 24ch; }
.flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; counter-reset: step; }
.flow li { padding-top: 14px; border-top: 3px solid var(--c); }
.flow h3 { font-size: 1.15rem; margin-bottom: 6px; }
.flow p { margin: 0; color: var(--muted); }
.promises { columns: 2; column-gap: 32px; color: var(--muted); padding-left: 20px; max-width: 900px; }
.promises li { margin-bottom: 8px; break-inside: avoid; }
.promises strong { color: var(--ink); }

/* ---------- toasts ---------- */
.toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 50; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--raised); border: 1px solid var(--line); border-left: 4px solid var(--lamp); border-radius: var(--radius-m); padding: 12px 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: center; animation: rise 260ms ease-out; }
.toast .face { width: 34px; height: 36px; }

      h("section", { class: "card" }, h("h2", { text: "Connections" }),

      h("section", { class: "card" }, h("h2", { text: "Notifications" }),

        state.me.local ? null : h("div", {}, h("button", { class: "btn", onclick: async () => { await api("/auth/logout", { method: "POST" }); location.href = "/"; } }, "Sign out"))));
  };

  // ---------- notifications ----------
  async function enablePush() {
    try {
      if (!("serviceWorker" in navigator) || !("PushManager" in window)) throw new Error(/iPhone|iPad/.test(navigator.userAgent) ? "On iPhone, add Relay to your Home Screen first, then open it from there." : "This browser cannot show notifications.");

      const json = sub.toJSON();

  }

  const USES = [

    ["reminder", "Reminders", "In your own words, once or on repeat."],
    ["morning_brief", "Morning brief", "Weather, your calendar, the news, and new email on one page."],
    ["web_watch", "Page watcher", "Keeps an eye on a page and speaks up only when it changes."],
    ["research", "Research", "A short report on a topic, with sources you can check."],
    ["weekly_plan", "Weekly plan", "Your goals and your calendar, turned into a realistic week."],
  ];
  function landing() {
    const params = new URLSearchParams(location.search);
    const notices = { "not-invited": "This Relay is invite-only. Ask its owner to add your Google account.", cancelled: "Sign-in was cancelled.", unverified: "That Google account's email is not verified." };
    const notice = notices[params.get("signin")];
    const art = document.createElementNS(NS, "svg"); art.setAttribute("viewBox", "0 0 560 340"); art.setAttribute("class", "hero-art"); art.setAttribute("role", "img"); art.setAttribute("aria-label", "A robot concierge at a front desk, with four robots working at their desks behind it");

    s("rect", { x: 0, y: 236, width: 560, height: 104, fill: "#161f27" }, art);            // floor
    s("rect", { x: 22, y: 22, width: 128, height: 92, rx: 4, fill: "#16213a" }, art);      // window

      const hgt = 26 + ((i * 41) % 52);
      s("rect", { x: 26 + i * 18, y: 114 - hgt, width: 14, height: hgt, fill: "#0f1726" }, art);
      if (i % 2 === 0) s("rect", { x: 30 + i * 18, y: 120 - hgt, width: 3, height: 4, fill: "#e8c76f" }, art);
    }
    s("rect", { x: 22, y: 22, width: 128, height: 92, rx: 4, fill: "none", stroke: "#2b3944", "stroke-width": 7 }, art);
    const desks = [["planner", 214], ["coder", 300], ["tester", 386], ["reviewer", 472]];
    for (const [r, x] of desks) {
      const lit = r === "coder";
      s("path", { d: `M${x} 0v38`, stroke: "#0f151a", "stroke-width": 2 }, art);
      s("path", { d: `M${x - 13} 50l7-12h12l7 12Z`, fill: "#2f3d47" }, art);
      if (lit) s("path", { d: `M${x - 10} 50h20l50 150h-120Z`, fill: "#f2b45a", opacity: 0.2 }, art);
      robot(art, r, x - 14, 154, { scale: 0.5 });
      s("rect", { x: x + 4, y: 128, width: 34, height: 26, rx: 3, fill: "#0a1418" }, art);   // monitor
      s("rect", { x: x + 7, y: 131, width: 28, height: 20, rx: 2, fill: lit ? "#16393b" : "#0e2326" }, art);
      if (lit) for (let k = 0; k < 4; k++) s("rect", { x: x + 10, y: 134 + k * 4, width: 10 + ((k * 7) % 12), height: 1.6, fill: "#cfe9d8" }, art);
      s("rect", { x: x - 40, y: 170, width: 82, height: 8, rx: 2, fill: "#5a4636" }, art);  // desk
      s("rect", { x: x - 34, y: 178, width: 70, height: 26, fill: "#3e3127" }, art);
    }
    s("rect", { x: 342, y: 162, width: 24, height: 14, rx: 2, fill: "#d9b46a" }, art);     // the folder on its way
    robot(art, "concierge", 112, 238, { scale: 1, wave: true, tie: true });
    s("rect", { x: 10, y: 250, width: 290, height: 16, rx: 3, fill: "#6b5442" }, art);     // front counter
    s("rect", { x: 22, y: 266, width: 266, height: 64, fill: "#4a3a2e" }, art);
    s("rect", { x: 112, y: 280, width: 86, height: 24, rx: 4, fill: "#c9b37a" }, art);
    const plate = s("text", { x: 155, y: 297, "text-anchor": "middle", fill: "#3a2e14", "font-size": 13, "font-weight": 800, "font-family": "Bricolage Grotesque, sans-serif" }, art); plate.textContent = "Concierge";
    s("path", { d: "M222 250a13 13 0 0 1 26 0", fill: "#f2b45a" }, art);                   // desk bell
    s("rect", { x: 218, y: 248, width: 34, height: 5, rx: 2, fill: "#f2b45a" }, art);

      h("header", { class: "landing-top" }, h("a", { class: "brand", href: "/", style: "padding:0" }, brandMark(), "Relay"),
        h("a", { class: "btn quiet", href: "/demo", text: "Watch the robots work" })),
      h("section", { class: "hero" },
        h("div", {}, notice ? h("p", { class: "notice", text: notice }) : null,
          h("h1", { text: "A night shift of robots for your errands." }),
          h("p", { text: "Tell Relay what you need: the news at 7, a summary of today's email, a file worked through. A small team of AI robots plans it, does it, checks it, and lets you know when it's done." }),
          h("div", { class: "cta" },
            state.me.google ? h("a", { class: "btn primary", href: "/auth/login", text: "Sign in with Google" }) : h("span", { class: "muted", text: "Sign-in is not set up on this server yet." }),
            h("a", { class: "btn", href: "/demo", text: "See a recorded job" }))),
        art),
      h("section", { class: "band" }, h("h2", { text: "Things you can hand over" }),

      h("section", { class: "band" }, h("h2", { text: "How a job travels" }),
        h("ol", { class: "flow" },
          h("li", { style: "--c: var(--violet)" }, h("h3", { text: "You ask the Concierge" }), h("p", { text: "In plain words. It sets up a one-off job or a routine, and shows you exactly what it understood before anything runs." })),
          h("li", { style: "--c: var(--mustard)" }, h("h3", { text: "The team works, even when you're away" }), h("p", { text: "The Planner makes a checklist, the Builder does the work, the Checker tests every item against the sources, and the Reviewer signs off." })),

  // ---------- render ----------
  function refreshView({ soft = false } = {}) {
    const { page } = route();
    if (soft && page === "today") {  // keep whatever is being typed in the ask box
      const grid = $(".today-grid"); if (grid) grid.replaceWith(todayGrid());
      return;
    }
    if (soft && page === "inbox" && route().id) {  // keep the open job (and its office) in place
      const col = $(".list-col .list"); if (col) col.replaceWith(h("ul", { class: "list" }, ...state.jobs.map(jobItem)));
      return;
    }
    const view = views[page] || views.today;
    $("#view").replaceChildren(view());
  }
  function render() {
    const root = $("#root");
    if (!state.me) return;
    if (!state.me.signed_in) { root.replaceChildren(landing()); return; }
    if (!$("#view")) {
      root.replaceChildren(h("div", { class: "shell" },
        h("nav", { class: "rail", id: "rail", "aria-label": "Main" }),
        h("main", { class: "view", id: "view", tabindex: "-1" }),
        h("nav", { class: "tabbar", id: "tabbar", "aria-label": "Main" })));
    }
    renderChrome();
    refreshView();
    const { page } = route();
    document.title = page === "today" ? "Relay" : `${page[0].toUpperCase()}${page.slice(1)}, Relay`;
  }

  addEventListener("message", (msg) => {
    if (msg.origin !== location.origin || msg.data?.type !== "office-height") return;
    const frame = $(".office-frame"); if (frame) frame.style.height = `${Math.max(420, msg.data.height)}px`;
  });

  // ---------- start ----------
  (async () => {
    try { await loadMe(); }
    catch { $("#root").replaceChildren(h("div", { class: "empty" }, h("h2", { text: "Relay could not load" }), h("p", { text: "Check your connection and refresh the page." }))); return; }
    const params = new URLSearchParams(location.search);
    if (params.get("connected")) { toast(`${params.get("connected") === "gmail" ? "Gmail" : "Calendar"} is connected.`, { role: "concierge" }); }
    if (params.get("connect") === "wrong-account") toast("Connect the same Google account you signed in with.");
    if (params.get("job")) location.hash = `#/inbox/${params.get("job")}`;
    if ([...params.keys()].length && state.me.signed_in) history.replaceState(null, "", location.pathname + location.hash);
    render();
    if (state.me.signed_in) {
      schedulePoll();
      if ("serviceWorker" in navigator && state.me.push_key) navigator.serviceWorker.register("/sw.js").catch(() => {});
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { clearTimeout(pollTimer); loadJobs().then(() => { renderChrome(); schedulePoll(); }).catch(() => {}); } });
    }
