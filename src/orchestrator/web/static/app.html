<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relay</title>
<meta name="description" content="A personal assistant run by a small crew of robots. Ask once; they work while you're away and let you know when it's done.">
<meta name="theme-color" content="#0b1117">
<script>
  // Choose the lighting before the first paint: your choice if you made one, else your device's.
  (() => { let t = null; try { t = localStorage.getItem("relay-theme"); } catch {}
    const sys = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    const theme = t === "light" || t === "dark" ? t : sys;
    document.documentElement.dataset.theme = theme;
    document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#f3f0e9" : "#0b1117"; })();
</script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="/static/unit.js"></script>
<script src="/static/vendor/marked.min.js" defer></script>
<script src="/static/vendor/purify.min.js" defer></script>
<style>
/* Relay: a control room for a crew of five robots who run your errands.
   Two lighting conditions over the same room: the night shift (dark) and daylight (light).
   One bold element per page; colour means a robot or a kind of work. Motion explains
   what is happening (a hand-off, a new result, a robot at work) and stops when you ask it to.
   data-tone="light|dark" on any element lights just that part the other way (the landing bands). */
:root, [data-tone="dark"] {
  --bg: #0b1117;
  --bg-blur: rgba(9, 14, 19, 0.82);
  --panel: #111b23;
  --raised: #182530;
  --line: #22313c;
  --line-2: #2f414d;
  --ink: #edf0ee;
  --muted: #9fb0ba;
  --dim: #6d808c;
  --lamp: #f2b45a;
  --lamp-ink: #2a1d08;
  --lamp-text: #f2b45a;
  --cyan: #5cc8d6;
  --card: #e4ebee;      /* the note card results are written on */
  --card-ink: #1f2a33;
  --card-head: #172029;
  --card-rule: #c3d3dc;
  --card-margin: #d98b84;
  --card-edge: #b9c7cf;
  --cobalt: #6b9be6;
  --mustard: #e6b04a;
  --sage: #5fc49a;
  --brick: #e07a70;
  --violet: #a08ce0;
  --good: #6fd39b;
  --bad: #ef7f74;
  --well: rgba(6, 11, 15, 0.7);
  --well-soft: rgba(255, 255, 255, 0.02);
  --grid: rgba(140, 180, 205, 0.045);
  --glow-a: rgba(92, 200, 214, 0.16);
  --glow-b: rgba(242, 180, 90, 0.12);
  --glow-c: rgba(160, 140, 224, 0.12);
  --warn-bg: #3a2f1f;
  --shadow: rgba(0, 0, 0, 0.55);
  --shadow-deep: rgba(0, 0, 0, 0.8);
  --mark-ink: #0b1117;
  --led-off: #33424d;
  --pad-off: #0c151b;
  --pad-bar: #22303a;
  --pad-done: #2f5a45;
  --floor-shadow: #16222b;
  --art-grid: #17232c;
  --art-deck-1: #1a2731;
  --art-deck-2: #0b1218;
  --art-edge: #33434f;
  --art-wire: #3a4c58;
  --art-ink: #edf0ee;
  --art-muted: #8d9faa;
  --sheen: rgba(255, 255, 255, 0.04);
  --crew: linear-gradient(90deg, var(--violet), var(--cobalt), var(--mustard), var(--sage), var(--brick), var(--violet));
  --surface: linear-gradient(180deg, #13202a, #0e1820);
  --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", Consolas, monospace;
  --radius-s: 6px;
  --radius-m: 12px;
  --radius-l: 20px;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --out: cubic-bezier(0.2, 0.8, 0.2, 1);
  color-scheme: dark;
}
:root[data-theme="light"], [data-tone="light"] {
  --bg: #f3f0e9;
  --bg-blur: rgba(250, 248, 243, 0.86);
  --panel: #ffffff;
  --raised: #ebe7de;
  --line: #e0dacf;
  --line-2: #cfc8ba;
  --ink: #18202a;
  --muted: #55606b;
  --dim: #7a838c;
  --lamp: #f2b04e;
  --lamp-ink: #2a1d08;
  --lamp-text: #a5620c;
  --cyan: #1f97a8;
  --card: #fffdf7;
  --card-ink: #222b33;
  --card-head: #121a22;
  --card-rule: #dfe7ec;
  --card-margin: #e7a49d;
  --card-edge: #e4dccd;
  --cobalt: #3d6cd0;
  --mustard: #c08410;
  --sage: #22905f;
  --brick: #cf5145;
  --violet: #7558d4;
  --good: #1f9a5b;
  --bad: #d0453a;
  --well: rgba(255, 255, 255, 0.92);
  --well-soft: rgba(24, 32, 42, 0.025);
  --grid: rgba(70, 90, 110, 0.07);
  --glow-a: rgba(64, 160, 210, 0.16);
  --glow-b: rgba(242, 166, 60, 0.2);
  --glow-c: rgba(120, 90, 220, 0.12);
  --warn-bg: #fcebd0;
  --shadow: rgba(70, 55, 30, 0.16);
  --shadow-deep: rgba(70, 55, 30, 0.28);
  --mark-ink: #ffffff;
  --led-off: #cdc6b8;
  --pad-off: #e5e0d6;
  --pad-bar: #d3ccbe;
  --pad-done: #a8dcbf;
  --floor-shadow: #ddd6c9;
  --art-grid: #ebe6dc;
  --art-deck-1: #ece7dd;
  --art-deck-2: #dcd5c7;
  --art-edge: #c5bcab;
  --art-wire: #b8ae9c;
  --art-ink: #18202a;
  --art-muted: #5f6a74;
  --sheen: rgba(255, 255, 255, 0.7);
  --surface: linear-gradient(180deg, #ffffff, #faf8f3);
  color-scheme: light;
}
@property --spin { syntax: "<angle>"; inherits: false; initial-value: 0deg; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5; background-color: var(--bg);
  /* a faint drafting grid under everything */
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 32px 32px; background-attachment: fixed; overflow-x: hidden;
  transition: background-color 0.5s ease, color 0.5s ease; }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
.panel-ish, .deck, .bay, .timeline-wrap, .latest-wrap, .setup, .plan, .routine, .card, .use, .invite, .say, .toast, .item, .pick, .file-row, .nav-link, .btn, .idea, .drop, .field input, .field textarea, .tabbar, .rail, .topbar {
  transition: background-color 0.5s ease, border-color 0.5s ease, color 0.5s ease, box-shadow 0.3s ease, transform 0.3s var(--out); }

/* ---------- the room's light: three slow glows drifting behind everything ---------- */
.aurora { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.aurora i { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(60px); opacity: 1; }
.aurora i:nth-child(1) { background: radial-gradient(closest-side, var(--glow-a), transparent); top: -30vmax; right: -18vmax; animation: drift-a 26s ease-in-out infinite alternate; }
.aurora i:nth-child(2) { background: radial-gradient(closest-side, var(--glow-b), transparent); bottom: -32vmax; left: -20vmax; animation: drift-b 32s ease-in-out infinite alternate; }
.aurora i:nth-child(3) { background: radial-gradient(closest-side, var(--glow-c), transparent); top: 30%; left: 40%; width: 40vmax; height: 40vmax; animation: drift-c 38s ease-in-out infinite alternate; }
@keyframes drift-a { to { transform: translate(-14vmax, 10vmax) scale(1.15); } }
@keyframes drift-b { to { transform: translate(16vmax, -8vmax) scale(1.2); } }
@keyframes drift-c { from { transform: translate(-30vmax, -10vmax); } to { transform: translate(10vmax, 14vmax) scale(0.85); } }

/* ---------- motion vocabulary ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }
@keyframes rise-small { from { opacity: 0; transform: translateY(8px); } }
@keyframes pop { 0% { opacity: 0; transform: scale(0.6); } 70% { opacity: 1; transform: scale(1.08); } 100% { transform: scale(1); } }
@keyframes fade { from { opacity: 0; } }
@keyframes pulse { 50% { opacity: 0.3; } }
@keyframes ping { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(2.6); opacity: 0; } }
@keyframes float { 50% { transform: translateY(-6px); } }
@keyframes shadow-breathe { 50% { transform: scaleX(0.82); opacity: 0.7; } }
@keyframes shimmer { to { background-position: -200% 0; } }
@keyframes stripe { to { background-position: 200% 0; } }
@keyframes spin { to { --spin: 360deg; } }
@keyframes draw { from { stroke-dashoffset: var(--len, 40); } to { stroke-dashoffset: 0; } }
@keyframes grow-y { from { transform: scaleY(0); } }
@keyframes grow-x { from { transform: scaleX(0); } }
@keyframes wiggle { 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
@keyframes bob { 50% { transform: translateY(-5px); opacity: 0.6; } }
@keyframes march { to { background-position: 40px 0; } }
.view-enter > * { animation: rise 0.6s var(--out) both; }
.view-enter .stagger > * { animation: rise 0.55s var(--out) both; animation-delay: calc(var(--i, 0) * 55ms + 120ms); }
.stagger > :nth-child(1) { --i: 0; } .stagger > :nth-child(2) { --i: 1; } .stagger > :nth-child(3) { --i: 2; } .stagger > :nth-child(4) { --i: 3; }
.stagger > :nth-child(5) { --i: 4; } .stagger > :nth-child(6) { --i: 5; } .stagger > :nth-child(7) { --i: 6; } .stagger > :nth-child(8) { --i: 7; }
.stagger > :nth-child(9) { --i: 8; } .stagger > :nth-child(10) { --i: 9; } .stagger > :nth-child(n+11) { --i: 10; }
.reveal { opacity: 0; transform: translateY(26px); transition: opacity 0.8s var(--out), transform 0.8s var(--out); }
.reveal.in { opacity: 1; transform: none; }
.reveal.in .stagger > * { animation: rise 0.6s var(--out) both; animation-delay: calc(var(--i, 0) * 70ms); }

/* ---------- buttons ---------- */
.btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--raised); font-weight: 700; text-decoration: none; isolation: isolate; }
.btn:hover { border-color: var(--dim); transform: translateY(-1px); box-shadow: 0 6px 16px -10px var(--shadow-deep); }
.btn:active { transform: translateY(0) scale(0.97); transition-duration: 0.08s; }
.btn.primary { background: var(--lamp); border-color: var(--lamp); color: var(--lamp-ink); box-shadow: 0 8px 22px -10px rgba(242, 180, 90, 0.85); }
.btn.primary::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, 0.55) 50%, transparent 65%); transform: translateX(-120%); z-index: -1; }
.btn.primary:hover::after { transform: translateX(120%); transition: transform 0.7s ease; }
.btn.primary:hover { filter: brightness(1.05); box-shadow: 0 12px 28px -10px rgba(242, 180, 90, 0.95); }
.btn.quiet { background: transparent; }
.btn.danger { color: var(--bad); background: transparent; }
.btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
.btn svg, .icon { width: 20px; height: 20px; flex: none; }
.btn:hover > svg:first-child { animation: wiggle 0.5s ease; }
.icon-btn { position: relative; overflow: hidden; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--raised); display: inline-grid; place-items: center; transition: transform 0.25s var(--spring), border-color 0.3s; }
.icon-btn:hover { transform: scale(1.08); border-color: var(--dim); }
.icon-btn:active { transform: scale(0.92); }
.ripple { position: absolute; border-radius: 50%; transform: scale(0); background: currentColor; opacity: 0.22; pointer-events: none; animation: ripple 0.65s ease-out forwards; z-index: -1; }
@keyframes ripple { to { transform: scale(1); opacity: 0; } }
.idea, .pick, .tab { position: relative; overflow: hidden; isolation: isolate; }

/* the theme switch: a sun that sets into a moon */
.theme-btn svg { width: 22px; height: 22px; overflow: visible; }
.theme-btn .sun-rays { transform-origin: 12px 12px; transition: transform 0.6s var(--spring), opacity 0.4s; }
.theme-btn .sun-core { transition: r 0.5s var(--spring); }
.theme-btn .moon-cut { transition: transform 0.6s var(--out); }
:root[data-theme="dark"] .theme-btn .sun-rays { transform: rotate(-90deg) scale(0.4); opacity: 0; }
:root[data-theme="dark"] .theme-btn .sun-core { r: 8px; }
:root[data-theme="light"] .theme-btn .moon-cut { transform: translate(10px, -10px); }
.theme-btn:hover svg { animation: wiggle 0.6s ease; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }
.rail { position: sticky; top: 0; height: 100vh; height: 100dvh; padding: 20px 14px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; background: var(--bg-blur); backdrop-filter: blur(10px); }
.rail-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-bottom: 14px; }
.rail-top .icon-btn { width: 40px; height: 40px; }
.rail-links { position: relative; display: grid; gap: 6px; }
.glider { position: absolute; left: 0; right: 0; top: 0; height: 46px; border-radius: var(--radius-m); background: var(--raised); box-shadow: inset 0 1px 0 var(--sheen); transition: transform 0.45s var(--spring), height 0.3s; z-index: 0; pointer-events: none; }
.glider::before { content: ""; position: absolute; left: -14px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--lamp); box-shadow: 0 0 12px var(--lamp); }
.glider.none { opacity: 0; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px; text-decoration: none; font-family: var(--display); font-weight: 800; font-size: 1.5rem; font-variation-settings: "wdth" 85; }
.brand svg { width: 34px; height: 34px; overflow: visible; }
.brand .antenna-led { animation: pulse 2.2s ease-in-out infinite; }
.brand:hover svg { animation: float 0.9s ease-in-out; }
.brand .visor-led { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
.nav-link { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 12px; border-radius: var(--radius-m); text-decoration: none; color: var(--muted); font-weight: 700; }
.nav-link:hover { color: var(--ink); }
.nav-link:hover .icon { transform: scale(1.15) rotate(-6deg); }
.nav-link .icon { transition: transform 0.3s var(--spring); }
.nav-link[aria-current="page"] { color: var(--ink); }
.nav-link[aria-current="page"] .icon { color: var(--lamp-text); }
.nav-link .count, .tabbar .count { margin-left: auto; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 999px; background: var(--lamp); color: var(--lamp-ink); font-size: 0.8rem; display: grid; place-items: center; }
.count.pop { animation: pop 0.5s var(--spring); }
.rail .me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: var(--radius-m); text-decoration: none; }
.rail .me:hover { background: var(--panel); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--raised); display: grid; place-items: center; font-weight: 700; overflow: hidden; flex: none; box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--line-2); }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.me .who { min-width: 0; }
.me .who strong, .me .who span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me .who span { color: var(--dim); font-size: 0.82rem; }
main.view { padding: 28px clamp(16px, 4vw, 48px) 120px; max-width: 1180px; width: 100%; min-width: 0; }
.tabbar, .topbar { display: none; }

/* ---------- loading ---------- */
.splash { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; align-content: center; gap: 14px; color: var(--muted); }
.splash svg { width: 72px; height: 72px; animation: float 1.6s ease-in-out infinite; }
.splash .bar { width: 160px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--raised) 0 30%, var(--lamp) 50%, var(--raised) 70% 100%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
.skeleton { border-radius: var(--radius-m); background: linear-gradient(90deg, var(--raised) 0 35%, var(--line) 50%, var(--raised) 65% 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }

/* ---------- Today: the command deck ---------- */
.deck { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; padding: 28px; border-radius: var(--radius-l);
  background: var(--surface); border: 1px solid var(--line-2); box-shadow: 0 34px 70px -40px var(--shadow-deep), inset 0 1px 0 var(--sheen); overflow: hidden; }
.deck::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--crew); background-size: 200% 100%; animation: stripe 8s linear infinite; }
.deck::after { content: ""; position: absolute; width: 380px; height: 380px; right: -120px; top: -160px; border-radius: 50%; background: radial-gradient(closest-side, var(--glow-b), transparent); pointer-events: none; animation: float 7s ease-in-out infinite; }
.deck-main { position: relative; z-index: 1; display: grid; gap: 16px; align-content: start; min-width: 0; }
.deck-head { display: grid; gap: 2px; }
.deck h1 { font-size: clamp(2rem, 4vw, 3.2rem); font-variation-settings: "wdth" 80, "opsz" 96; font-weight: 800; letter-spacing: -0.015em; }
.deck h1 .word { display: inline-block; animation: rise 0.7s var(--out) both; }
.deck h1 .wave-hand { display: inline-block; transform-origin: 70% 70%; animation: hand 2.2s ease-in-out 0.6s 2; }
@keyframes hand { 0%, 60%, 100% { transform: rotate(0); } 10%, 30% { transform: rotate(14deg); } 20%, 40% { transform: rotate(-8deg); } }
.deck .date { color: var(--muted); }
.ask { position: relative; background: var(--well); border: 1px solid var(--line-2); border-radius: 16px; padding: 14px; display: grid; gap: 10px; isolation: isolate; }
.ask::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1.5px; z-index: -1; opacity: 0; transition: opacity 0.4s;
  background: conic-gradient(from var(--spin), var(--violet), var(--cobalt), var(--mustard), var(--sage), var(--brick), var(--violet));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: spin 4s linear infinite; }
.ask:focus-within { border-color: transparent; box-shadow: 0 0 0 6px color-mix(in srgb, var(--lamp) 10%, transparent), 0 18px 40px -24px var(--shadow-deep); }
.ask:focus-within::before { opacity: 1; }
.ask label { font-family: var(--display); font-weight: 700; font-size: 1.12rem; padding: 2px 4px 0; }
.ask textarea { width: 100%; min-height: 56px; max-height: 240px; resize: none; border: 0; background: transparent; outline: none; padding: 4px; font-size: 1.08rem; transition: height 0.2s ease; }
.ask textarea::placeholder { color: var(--dim); }
.ask-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ask-row .spacer { flex: 1; }
#ask-send.flying svg { animation: fly 0.7s ease-in forwards; }
@keyframes fly { 40% { transform: translate(-4px, 3px) rotate(-8deg); } 100% { transform: translate(40px, -30px) rotate(-20deg); opacity: 0; } }
.attached { display: flex; gap: 6px; flex-wrap: wrap; }
.file-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 12px; border-radius: 999px; background: var(--raised); font-size: 0.88rem; animation: pop 0.4s var(--spring); }
.file-chip button { width: 26px; height: 26px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); }
.ideas { display: flex; gap: 8px; flex-wrap: wrap; }
.idea { display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 13px 0 8px; font-size: 0.92rem; border-radius: 999px; border: 1px solid var(--line-2); background: var(--well-soft); color: var(--muted); animation: rise-small 0.5s var(--out) both; animation-delay: calc(var(--i, 0) * 60ms + 250ms); }
.idea:hover { color: var(--ink); border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); transform: translateY(-2px); }
.idea:hover .dot { animation: wiggle 0.5s ease; }
.idea .dot { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; background: var(--c); color: var(--mark-ink); }
.idea .dot svg { width: 14px; height: 14px; }

/* the crew: five units on their pads, lit by what they are doing */
.bay { position: relative; z-index: 1; display: grid; gap: 12px; text-decoration: none; border-radius: 16px; padding: 14px 14px 16px; min-width: 0;
  background: linear-gradient(180deg, transparent, var(--well)); border: 1px solid var(--line); }
.bay:hover { border-color: var(--line-2); }
.bay:hover .bay-link svg { transform: translateX(3px) scale(1.1); }
.bay-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 0 4px; }
.bay-head h2 { font-size: 1.2rem; }
.bay-link { display: inline-flex; gap: 8px; align-items: center; color: var(--lamp-text); font-weight: 700; }
.bay-link svg { transition: transform 0.3s var(--spring); }
.crew-strip { position: relative; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.crew-strip.live::before { content: ""; position: absolute; left: 10%; right: 10%; top: 44%; height: 2px; z-index: 0;
  background: repeating-linear-gradient(90deg, var(--lamp) 0 8px, transparent 8px 20px); background-size: 40px 2px; opacity: 0.5; animation: march 0.8s linear infinite; }
.crew-cell { position: relative; z-index: 1; display: grid; justify-items: center; text-align: center; gap: 1px; padding: 10px 6px 12px; border-radius: 14px; border: 1px solid transparent; background: var(--well-soft); min-width: 0; transition: transform 0.35s var(--spring), border-color 0.4s, background-color 0.4s; }
.crew-cell:hover { transform: translateY(-4px); }
.crew-cell svg { width: 100%; max-width: 120px; height: auto; overflow: visible; }
.crew-cell .unit-float { animation: float 3.2s ease-in-out infinite; animation-delay: calc(var(--i, 0) * -0.6s); }
.crew-cell.active .unit-float { animation-duration: 1.4s; }
.crew-cell .pad-glow { transform-box: fill-box; transform-origin: center; animation: shadow-breathe 3.2s ease-in-out infinite; animation-delay: calc(var(--i, 0) * -0.6s); }
.crew-cell.active { border-color: color-mix(in srgb, var(--c) 55%, transparent); background: color-mix(in srgb, var(--c) 9%, transparent); box-shadow: 0 0 30px -12px var(--c); }
.crew-cell.done .uid::after { content: " ✓"; color: var(--good); }
.crew-cell .uid { font-family: var(--mono); font-size: 0.74rem; color: var(--c); margin-top: 6px; }
.crew-cell strong { font-family: var(--display); font-size: 1rem; }
.crew-cell .doing { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 0.82rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crew-cell.active .doing { color: var(--ink); }
.crew-cell .led { position: relative; width: 7px; height: 7px; border-radius: 50%; background: var(--led-off); flex: none; }
.crew-cell.active .led { background: var(--c); box-shadow: 0 0 10px var(--c); }
.crew-cell.active .led::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--c); animation: ping 1.4s ease-out infinite; }
.crew-cell.done .led { background: var(--good); }
.robot .arm { transform-box: fill-box; transform-origin: 50% 0%; }
.robot.active .arm.left, .crew-cell.active .robot .arm.left { animation: type 0.32s ease-in-out infinite alternate; }
.robot.active .arm.right, .crew-cell.active .robot .arm.right { animation: type 0.32s ease-in-out infinite alternate-reverse; }
@keyframes type { from { transform: rotate(-7deg); } to { transform: rotate(5deg); } }
.robot.active .bulb { animation: pulse 1.4s ease-in-out infinite; }
.robot .eyes-open, .robot .eyes-shut, .robot .eyes-happy { transition: opacity 200ms; }

/* the Concierge's reply */
.reply { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: start; animation: rise 0.45s var(--out); }
.reply .face { width: 44px; height: 46px; }
.reply.thinking-now .face { animation: float 1s ease-in-out infinite; }
.reply-body { display: grid; gap: 12px; }
.say { background: var(--raised); border-radius: 4px var(--radius-m) var(--radius-m) var(--radius-m); padding: 10px 14px; border-left: 3px solid var(--violet); max-width: 68ch; transform-origin: 0 0; animation: pop-say 0.45s var(--spring); }
@keyframes pop-say { from { opacity: 0; transform: scale(0.85); } }
.say .caret { display: inline-block; width: 2px; height: 1em; background: var(--violet); vertical-align: -2px; margin-left: 1px; animation: pulse 0.8s steps(1) infinite; }
.thinking { display: inline-flex; gap: 5px; align-items: center; }
.thinking i { width: 7px; height: 7px; border-radius: 50%; background: var(--violet); animation: bob 1s infinite ease-in-out; }
.thinking i:nth-child(2) { animation-delay: 0.15s; } .thinking i:nth-child(3) { animation-delay: 0.3s; }
.plan { position: relative; border: 1px solid var(--line-2); border-radius: var(--radius-m); padding: 18px; display: grid; gap: 10px; max-width: 640px; background: var(--surface); box-shadow: inset 0 1px 0 var(--sheen), 0 20px 40px -30px var(--shadow-deep); animation: pop-say 0.55s var(--spring) 0.15s both; overflow: hidden; }
.plan::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--c, var(--lamp)); animation: grow-y 0.6s var(--out) 0.3s both; transform-origin: top; }
.plan-head { display: flex; gap: 12px; align-items: center; }
.plan-head .skill-mark { animation: pop 0.6s var(--spring) 0.3s both; }
.skill-mark { width: 40px; height: 40px; border-radius: var(--radius-m); display: grid; place-items: center; color: var(--mark-ink); flex: none;
  background: linear-gradient(145deg, color-mix(in srgb, var(--c) 100%, #fff 12%), color-mix(in srgb, var(--c) 78%, #000)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 6px 14px -8px var(--c); transition: transform 0.35s var(--spring); }
.skill-mark svg { width: 22px; height: 22px; }
.plan h3 { font-size: 1.25rem; }
.plan .kind { color: var(--muted); font-size: 0.92rem; }
.when { display: inline-flex; align-items: center; gap: 8px; color: var(--lamp-text); font-weight: 700; }
.when svg { animation: spin-slow 8s linear infinite; }
@keyframes spin-slow { to { transform: rotate(360deg); } }
.plan details summary { cursor: pointer; color: var(--muted); }
.plan details p { margin: 8px 0 0; color: var(--muted); white-space: pre-wrap; animation: rise-small 0.3s ease; }
.warn { background: var(--warn-bg); border-radius: var(--radius-s); padding: 10px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.plan .actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- sections on Today ---------- */
.today-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; margin-top: 30px; }
.timeline-wrap, .latest-wrap { border: 1px solid var(--line); border-radius: var(--radius-m); padding: 18px; background: color-mix(in srgb, var(--panel) 70%, transparent); backdrop-filter: blur(6px); }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.section-head h2 { font-size: 1.45rem; font-variation-settings: "wdth" 85; }
.section-head a { color: var(--muted); font-size: 0.92rem; text-decoration-color: transparent; transition: color 0.2s, text-decoration-color 0.2s; }
.section-head a:hover { color: var(--ink); text-decoration-color: currentColor; }
.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline::before { content: ""; position: absolute; left: 91px; top: 8px; bottom: 8px; width: 2px; background: linear-gradient(var(--lamp), var(--line) 40%); transform-origin: top; animation: grow-y 0.9s var(--out) 0.2s both; }
.timeline li { display: grid; grid-template-columns: 72px 22px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 0; border-radius: 10px; transition: background-color 0.2s; }
.timeline li:hover { background: var(--well-soft); }
.timeline .t { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.timeline .t small { display: block; color: var(--dim); font-weight: 400; font-size: 0.8rem; }
.timeline .pin { position: relative; width: 14px; height: 14px; border-radius: 50%; background: var(--c); margin: 5px 0 0 3px; box-shadow: 0 0 0 4px var(--bg); z-index: 1; }
.timeline li:first-child .pin::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--c); animation: ping 1.8s ease-out infinite; }
.timeline .what strong { display: block; }
.timeline .what span { color: var(--muted); font-size: 0.9rem; }
.setup { border: 1px solid var(--line-2); border-radius: var(--radius-m); padding: 18px; display: grid; gap: 4px; background: var(--surface); box-shadow: 0 24px 50px -40px var(--shadow-deep); }
.meter { height: 8px; border-radius: 4px; background: var(--raised); overflow: hidden; margin: 6px 0 8px; }
.meter span { display: block; height: 100%; background: linear-gradient(90deg, var(--lamp), color-mix(in srgb, var(--lamp) 70%, #fff)); border-radius: 4px; transform-origin: left; animation: grow-x 1.1s var(--out) 0.4s both; position: relative; overflow: hidden; }
.meter span::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent); background-size: 200% 100%; animation: shimmer 2s linear infinite; }
.step { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 48px; }
.check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.step.done .check { background: var(--good); border-color: var(--good); color: var(--bg); animation: pop 0.5s var(--spring) both; }
.step.done .check path { stroke-dasharray: 20; animation: draw 0.5s ease 0.25s both; --len: 20; }
.step.done .label { color: var(--dim); text-decoration: line-through; }

/* ---------- Inbox ---------- */
.inbox { display: grid; grid-template-columns: minmax(260px, 360px) minmax(0, 1fr); gap: 24px; align-items: start; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.item { position: relative; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; padding: 12px; border-radius: var(--radius-m); text-decoration: none; align-items: start; }
.item:hover { background: var(--panel); transform: translateX(3px); }
.item:hover .skill-mark, .pick:hover .skill-mark, .file-row:hover .kind { transform: rotate(-8deg) scale(1.08); }
.item[aria-current="true"] { background: var(--raised); box-shadow: inset 3px 0 0 var(--lamp); }
.item .skill-mark { width: 36px; height: 36px; border-radius: 10px; }
.item .skill-mark svg { width: 18px; height: 18px; }
.item strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .snippet { color: var(--muted); font-size: 0.9rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item .meta { text-align: right; color: var(--dim); font-size: 0.8rem; white-space: nowrap; display: grid; justify-items: end; gap: 6px; }
.unread-dot { position: relative; width: 10px; height: 10px; border-radius: 50%; background: var(--lamp); }
.unread-dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--lamp); animation: ping 2s ease-out infinite; }
.state { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--raised); color: var(--muted); }
.state.running, .state.queued { color: var(--lamp-text); }
.state.failed, .state.skipped { color: var(--bad); }
.state.running::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--lamp); animation: pulse 1.2s infinite; }
.detail { display: grid; gap: 16px; min-width: 0; }
.detail > * { animation: rise 0.5s var(--out) both; }
.detail > :nth-child(2) { animation-delay: 0.08s; } .detail > :nth-child(3) { animation-delay: 0.16s; } .detail > :nth-child(4) { animation-delay: 0.24s; }
.detail-head { display: flex; gap: 14px; align-items: flex-start; }
.detail-head .skill-mark { animation: pop 0.6s var(--spring) both; }
.detail-head h1 { font-size: clamp(1.6rem, 3vw, 2.2rem); font-variation-settings: "wdth" 85; }
.detail-head .sub { color: var(--muted); }
.from-team { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: start; }
.from-team .face { width: 40px; height: 42px; }
.from-team .say { border-left-color: var(--brick); }
.note-card { position: relative; background: var(--card); color: var(--card-ink); border-radius: 4px 4px var(--radius-m) var(--radius-m); padding: 28px clamp(18px, 4vw, 40px) 28px clamp(30px, 5vw, 56px);
  background-image: linear-gradient(90deg, transparent calc(clamp(22px, 3.6vw, 40px) - 1px), var(--card-margin) calc(clamp(22px, 3.6vw, 40px) - 1px), var(--card-margin) clamp(22px, 3.6vw, 40px), transparent clamp(22px, 3.6vw, 40px)),
                    repeating-linear-gradient(var(--card) 0 27px, var(--card-rule) 27px 28px);
  box-shadow: 0 2px 0 var(--card-edge), 0 14px 30px var(--shadow); font-size: 1rem; line-height: 28px; overflow-wrap: anywhere;
  transform-origin: 50% 0; animation: unfold 0.7s var(--out) 0.15s both; }
@keyframes unfold { from { opacity: 0; transform: perspective(900px) rotateX(-14deg) translateY(-10px); } }
.note-card::before { content: ""; position: absolute; top: -9px; left: 50%; width: 90px; height: 20px; margin-left: -45px; background: color-mix(in srgb, var(--lamp) 45%, transparent); transform: rotate(-2deg); border-radius: 2px; opacity: 0.8; }
.note-card h1, .note-card h2, .note-card h3 { font-family: var(--display); line-height: 28px; margin: 28px 0 0; color: var(--card-head); }
.note-card h1 { font-size: 1.5rem; } .note-card h2 { font-size: 1.22rem; } .note-card h3 { font-size: 1.05rem; }
.note-card > :first-child { margin-top: 0; }
.note-card p, .note-card ul, .note-card ol, .note-card table { margin: 0 0 28px; }
.note-card li > p { margin: 0; }
.note-card > :last-child { margin-bottom: 0; }
.note-card a { color: #2a5aa8; }
.note-card code { background: rgba(31, 42, 51, 0.08); padding: 1px 5px; border-radius: 4px; }
.note-card pre { background: rgba(31, 42, 51, 0.08); padding: 12px; border-radius: 6px; overflow: auto; line-height: 1.5; }
.note-card table { border-collapse: collapse; display: block; overflow: auto; line-height: 1.4; }
.note-card th, .note-card td { border: 1px solid var(--card-rule); padding: 6px 10px; text-align: left; vertical-align: top; }
.note-card blockquote { margin: 0 0 14px; padding-left: 14px; border-left: 3px solid var(--card-rule); color: #44515b; }
.note-card iframe { width: 100%; height: 520px; border: 0; background: #fff; border-radius: 6px; }
.result-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); transition: all 0.25s var(--out); }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); background: var(--raised); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.office-toggle { justify-self: start; }
.office-toggle[aria-expanded="true"] { border-color: var(--lamp); }
.office-toggle[aria-expanded="false"] svg { animation: peek 3s ease-in-out infinite; }
@keyframes peek { 0%, 80%, 100% { transform: scaleY(1); } 88% { transform: scaleY(0.15); } }
.office-frame { width: 100%; border: 0; border-radius: var(--radius-l); background: var(--bg); min-height: 420px; display: block; box-shadow: 0 30px 60px -40px var(--shadow-deep); animation: rise 0.6s var(--out); }
.empty { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 48px 16px; color: var(--muted); }
.empty svg { width: 160px; height: 140px; overflow: visible; }
.empty svg .unit-float { animation: float 2.6s ease-in-out infinite; }
.empty svg .floor-shadow { transform-box: fill-box; transform-origin: center; animation: shadow-breathe 2.6s ease-in-out infinite; }
.empty h2 { color: var(--ink); font-size: 1.4rem; }

/* ---------- Agents ---------- */
.agents { display: grid; grid-template-columns: minmax(240px, 300px) minmax(0, 1fr); gap: 24px; align-items: start; }
.list-label { font-family: var(--body); font-size: 0.82rem; color: var(--dim); font-weight: 700; margin: 16px 4px 6px; text-transform: uppercase; letter-spacing: 0.06em; }
.pick { width: 100%; text-align: left; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px; border-radius: var(--radius-m); border: 1px solid transparent; background: transparent; }
.pick:hover { background: var(--panel); transform: translateX(3px); }
.pick[aria-pressed="true"] { background: var(--raised); border-color: var(--line-2); box-shadow: inset 3px 0 0 var(--lamp); }
.pick .skill-mark { width: 36px; height: 36px; border-radius: 10px; }
.pick .skill-mark svg { width: 18px; height: 18px; }
.pick strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick .snippet { color: var(--muted); font-size: 0.86rem; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agents-stage { display: grid; gap: 14px; min-width: 0; }
.stage-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-end; flex-wrap: wrap; animation: rise 0.45s var(--out); }
.stage-head h1 { font-size: clamp(1.5rem, 3vw, 2.2rem); font-variation-settings: "wdth" 85; }

/* ---------- Routines ---------- */
.routines { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
.routine { position: relative; border: 1px solid var(--line-2); border-radius: var(--radius-m); padding: 18px; display: grid; gap: 10px; background: var(--surface); box-shadow: inset 0 3px 0 var(--c); overflow: hidden; }
.routine:hover { transform: translateY(-4px); box-shadow: inset 0 3px 0 var(--c), 0 22px 40px -26px color-mix(in srgb, var(--c) 70%, transparent); border-color: color-mix(in srgb, var(--c) 45%, var(--line-2)); }
.routine:hover .skill-mark { transform: rotate(-8deg) scale(1.08); }
.routine.off { opacity: 0.62; filter: saturate(0.6); }
.routine-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.routine h3 { font-size: 1.15rem; }
.routine .next { color: var(--muted); font-size: 0.9rem; }
.switch { position: relative; width: 52px; height: 30px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line-2); transition: background 0.3s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3); transition: transform 0.45s var(--spring), width 0.2s; }
.switch input:active + span::after { width: 28px; }
.switch input:checked + span { background: var(--good); }
.switch input:checked + span::after { transform: translateX(22px); }
.switch input:checked:active + span::after { transform: translateX(16px); }
.switch input:focus-visible + span { outline: 3px solid var(--lamp); outline-offset: 2px; }
.routine .actions { display: flex; gap: 6px; flex-wrap: wrap; }
.routine .btn { min-height: 38px; padding: 0 14px; font-size: 0.92rem; }

/* ---------- Files ---------- */
.drop { position: relative; border: 2px dashed var(--line-2); border-radius: var(--radius-l); padding: 34px 20px; display: grid; justify-items: center; gap: 10px; text-align: center; color: var(--muted); background: var(--well-soft); }
.drop > .icon { width: 40px; height: 40px; color: var(--lamp-text); animation: float 2.4s ease-in-out infinite; }
.drop:hover { border-color: var(--dim); }
.drop.over { border-color: var(--lamp); background: color-mix(in srgb, var(--lamp) 8%, transparent); transform: scale(1.01); }
.drop.over > .icon { animation: bounce 0.6s ease infinite; }
@keyframes bounce { 50% { transform: translateY(-10px) scale(1.1); } }
.files { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 4px; }
.file-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: var(--radius-m); }
.file-row:hover { background: var(--panel); }
.file-row .kind { width: 40px; height: 48px; border-radius: 4px 12px 4px 4px; background: var(--raised); display: grid; place-items: center; font-size: 0.7rem; font-weight: 700; color: var(--muted); transition: transform 0.35s var(--spring); }
.file-row strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Settings ---------- */
.settings { display: grid; gap: 22px; max-width: 720px; }
.card { border: 1px solid var(--line-2); border-radius: var(--radius-m); padding: 20px; display: grid; gap: 14px; background: var(--surface); box-shadow: 0 24px 50px -44px var(--shadow-deep); }
.card h2 { font-size: 1.25rem; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 700; }
.field input, .field select, .field textarea { min-height: 44px; padding: 8px 12px; border-radius: var(--radius-s); border: 1px solid var(--line-2); background: var(--bg); }
.field input:focus, .field textarea:focus { border-color: var(--lamp); box-shadow: 0 0 0 4px color-mix(in srgb, var(--lamp) 15%, transparent); outline: none; }
.field textarea { min-height: 90px; resize: vertical; }
.conn { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.conn .skill-mark { width: 40px; height: 40px; }
.segmented { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px; border-radius: 999px; background: var(--raised); border: 1px solid var(--line); max-width: 420px; }
.segmented button { position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-weight: 700; transition: color 0.3s; }
.segmented button[aria-pressed="true"] { color: var(--ink); }
.segmented button svg { width: 18px; height: 18px; }
.segmented button[aria-pressed="true"] svg { animation: wiggle 0.5s ease; }
.segmented .pill { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 3); border-radius: 999px; background: var(--panel); box-shadow: 0 4px 12px -4px var(--shadow-deep), inset 0 1px 0 var(--sheen); transition: transform 0.5s var(--spring); }
.theme-preview { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.swatch { border-radius: var(--radius-m); padding: 12px; border: 1px solid var(--line); display: grid; gap: 8px; font-size: 0.85rem; font-weight: 700; }
.swatch i { display: block; height: 8px; border-radius: 4px; }

.invite { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; padding: 18px; border-radius: var(--radius-m); border: 1px solid var(--line-2); background: var(--surface); margin-bottom: 14px; max-width: 560px; box-shadow: 0 30px 60px -40px var(--shadow-deep); animation: rise 0.8s var(--out) 0.6s both; position: relative; overflow: hidden; }

  background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--c, var(--lamp)) 18%, transparent), transparent 70%); }

.stat { position: relative; border: 1px solid var(--line-2); border-radius: var(--radius-m); padding: 18px 20px; background: var(--surface); overflow: hidden; isolation: isolate; }
.stat b { display: block; font-family: var(--display); font-size: clamp(2.2rem, 5vw, 3.4rem); font-weight: 800; line-height: 1; color: var(--c); font-variant-numeric: tabular-nums; font-variation-settings: "wdth" 80; }

      return;
    }
    if (soft && page === "inbox" && route().id) {  // keep the open job (and its office) in place
      const col = $(".list-col .list"); if (col) col.replaceWith(h("ul", { class: "list" }, ...state.jobs.map(jobItem)));
      return;
    }
    const view = views[page] || views.today;
    const main = $("#view");
    // A new page slides in (its lists one row after another); refreshing the same page doesn't.
    const changed = refreshView.page !== page;
    refreshView.page = page;
    main.classList.toggle("view-enter", changed && !reduced());
    clearTimeout(refreshView.timer);
    if (changed) refreshView.timer = setTimeout(() => main.classList.remove("view-enter"), 1400);
    main.replaceChildren(...(state.me.guest ? [guestBar()] : []), view());
    if (changed) scrollTo({ top: 0 });
    watchReveals(main);
  }
  function render() {
    const root = $("#root");
    if (!state.me) return;
    if (!state.me.signed_in) { root.replaceChildren(landing()); watchReveals(root); return; }
    if (!$("#view")) {
      root.replaceChildren(h("div", { class: "shell" },
        h("nav", { class: "rail", id: "rail", "aria-label": "Main" }),
        h("header", { class: "topbar", id: "topbar" }),
        h("main", { class: "view", id: "view", tabindex: "-1" }),
        h("nav", { class: "tabbar", id: "tabbar", "aria-label": "Main" })));
    }
    renderChrome();
    refreshView();
    const { page } = route();
    document.title = page === "today" ? "Relay" : `${page[0].toUpperCase()}${page.slice(1)}, Relay`;
  }

  addEventListener("message", (msg) => {
    if (msg.origin !== location.origin || msg.data?.type !== "office-height") return;
    const frame = $(".office-frame"); if (frame) frame.style.height = `${Math.max(420, msg.data.height)}px`;
  });

  // ---------- start ----------
  (async () => {
    try { await loadMe(); }
    catch { $("#root").replaceChildren(h("div", { class: "empty" }, h("h2", { text: "Relay could not load" }), h("p", { text: "Check your connection and refresh the page." }))); return; }
    const params = new URLSearchParams(location.search);
    if (params.get("connected")) { toast(`${params.get("connected") === "gmail" ? "Gmail" : "Calendar"} is connected.`, { role: "concierge" }); }
    if (params.get("connect") === "wrong-account") toast("Connect the same Google account you signed in with.");
    if (params.get("job")) location.hash = `#/inbox/${params.get("job")}`;
    if ([...params.keys()].length && state.me.signed_in) history.replaceState(null, "", location.pathname + location.hash);
    render();
    if (state.me.signed_in) {
      schedulePoll();
      if ("serviceWorker" in navigator && state.me.push_key) navigator.serviceWorker.register("/sw.js").catch(() => {});
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { clearTimeout(pollTimer); loadJobs().then(() => { renderChrome(); schedulePoll(); }).catch(() => {}); } });
    }
  })();
})();
</script>
</body>
</html>
