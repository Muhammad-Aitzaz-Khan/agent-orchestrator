[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "A multi-agent orchestration system with tracing and an evaluation harness"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "anthropic",
    "openai",
    "pydantic>=2",
    "python-dotenv",
]

[project.optional-dependencies]
web = [
    "fastapi",
    "uvicorn",
]
dev = [
    "pytest",
    "ruff",
    "httpx",
    "fastapi",
    "uvicorn",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"orchestrator" = ["guard/*.py"]
"orchestrator.web" = ["static/*", "replays/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# The eval tasks contain deliberate bugs. Never let a linter "fix" them.
extend-exclude = ["evals/tasks"]