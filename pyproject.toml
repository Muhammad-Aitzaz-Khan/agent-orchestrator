[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "Relay: a personal assistant run by a small team of AI agents, with a benchmark that measures whether the team helps"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "openai",
    "pydantic>=2",
    "python-dotenv",
]

[project.optional-dependencies]
web = [
    "fastapi",
    "uvicorn",
    "httpx",
    "itsdangerous",
    "python-multipart",
    "sqlalchemy>=2",
    "psycopg[binary]",
    "cryptography",
    "pywebpush",
    "pypdf",
    "python-docx",
    "defusedxml",
]
dev = [
    "agent-orchestrator[web]",
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"orchestrator" = ["guard/*.py"]
"orchestrator.web" = ["static/*", "static/vendor/*", "static/icons/*", "replays/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# The eval tasks contain deliberate bugs. Never let a linter "fix" them.
extend-exclude = ["evals/tasks"]